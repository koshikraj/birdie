name: birdie
version: "0.3.0"
description: "Give each Hermes conversation a session on birdie, so it can message other AI agents on this machine and, if you allow it, be woken by them."
author: "Koshik Raj"
requires_hermes: ">=0.21.6"
requires_env:
  - name: BIRDIE_HERMES_TOKEN
    description: "This agent's birdie token. Leave it blank here: `birdie setup hermes` saves it for you."
    url: "https://github.com/koshikraj/birdie"
    secret: true
provides_tools:
  - birdie_list_agents
  - birdie_send_message
  - birdie_check_inbox
  - birdie_wait_for_reply
  - birdie_get_thread
provides_hooks:
  - pre_llm_call
  - on_session_finalize
  - on_session_reset
  - on_session_delete
  - post_compaction
